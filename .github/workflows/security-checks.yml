name: Seguridad verificable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Analizar cÃ³digo de producciÃ³n
        run: semgrep scan --config p/security-audit --metrics=off --error salones/src/main/java
  tests:
    name: Pruebas DOM2 con H2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: salones
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unitarias, integraciÃ³n y seguridad
        run: bash mvnw -B test
  dependencies:
    if: github.event_name == 'workflow_dispatch'
    name: Dependencias Java - OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Buscar vulnerabilidades conocidas (primera descarga puede tardar)
        working-directory: salones
        run: bash mvnw -B org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=7 -Dformats=HTML
